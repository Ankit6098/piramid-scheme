name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per branch/PR; superseded PR runs are cancelled, pushes to main always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: read the repository, nothing else. (Docker layer caching uses the Actions cache
# service through the runner token and needs no extra permission.)
permissions:
  contents: read

env:
  NODE_VERSION: '22'
  NEXT_TELEMETRY_DISABLED: '1'
  CHECKPOINT_DISABLE: '1'
  PRISMA_HIDE_UPDATE_MESSAGE: '1'

jobs:
  quality:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test

  integration:
    name: Integration tests (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: referral
          POSTGRES_PASSWORD: referral_ci_password
          POSTGRES_DB: referral_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U referral -d referral_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
      # Captures outgoing email; the OTP/outbox suites read delivered messages from its API.
      mailpit:
        image: axllent/mailpit:latest
        ports: ['1025:1025', '8025:8025']
    env:
      NODE_ENV: test
      MAILPIT_URL: http://127.0.0.1:8025
      DATABASE_URL: postgresql://referral:referral_ci_password@localhost:5432/referral_test?schema=public
      TEST_DATABASE_URL: postgresql://referral:referral_ci_password@localhost:5432/referral_test?schema=public
      REDIS_URL: redis://localhost:6379
      # Test-only values (not secrets). The three keys must differ.
      OTP_PEPPER: 0f1e2d3c4b5a69788796a5b4c3d2e1f00f1e2d3c4b5a69788796a5b4c3d2e1f0
      OTP_OUTBOX_KEY: 1a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f809
      MFA_ENCRYPTION_KEY: 9f8e7d6c5b4a39281706f5e4d3c2b1a09f8e7d6c5b4a39281706f5e4d3c2b1a0
      APP_PUBLIC_URL: http://localhost:8080
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          filter: '@app/api...'
      - name: Apply migrations (prisma migrate deploy)
        run: pnpm --filter @app/api db:deploy
      - name: Integration tests
        run: pnpm --filter @app/api test:integration

  build:
    name: Build shared, api, web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'packages/shared/src/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Build
        run: pnpm build
      - name: Check build outputs
        run: |
          test -f apps/api/dist/main.js
          test -f apps/api/dist/worker.js
          test -f apps/web/.next/standalone/apps/web/server.js

  docker:
    name: Docker build (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: infra/docker/api.Dockerfile
            target: runtime
          - image: api-tools
            dockerfile: infra/docker/api.Dockerfile
            target: tools
          - image: web
            dockerfile: infra/docker/web.Dockerfile
            target: runtime
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.image }} image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: false
          tags: referral-platform/${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  e2e:
    name: End-to-end (Playwright, production compose)
    needs: [build, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      IMAGE_TAG: ci
      COMPOSE_FILE: docker-compose.prod.yml
      COMPOSE_PROFILES: dev-mail
      E2E_BASE_URL: http://localhost:8080
      MAILPIT_URL: http://localhost:8025
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          filter: referral-platform
          build-shared: 'false'
          prisma-generate: 'false'
      - uses: docker/setup-buildx-action@v3

      # Rebuild from the layer cache warmed by the `docker` job and load into the local daemon.
      - name: Load api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          target: runtime
          load: true
          tags: referral-platform/api:ci
          cache-from: type=gha,scope=api
      - name: Load api-tools image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          target: tools
          load: true
          tags: referral-platform/api-tools:ci
          cache-from: type=gha,scope=api-tools
      - name: Load web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          target: runtime
          load: true
          tags: referral-platform/web:ci
          cache-from: type=gha,scope=web

      - name: Write stack configuration (.env, throwaway secrets)
        run: |
          pg_password="$(openssl rand -hex 24)"
          redis_password="$(openssl rand -hex 24)"
          otp_pepper="$(openssl rand -hex 32)"
          otp_outbox_key="$(openssl rand -hex 32)"
          mfa_encryption_key="$(openssl rand -hex 32)"
          admin_password="E2e-$(openssl rand -hex 12)"
          echo "::add-mask::$pg_password"
          echo "::add-mask::$redis_password"
          echo "::add-mask::$otp_pepper"
          echo "::add-mask::$otp_outbox_key"
          echo "::add-mask::$mfa_encryption_key"
          echo "::add-mask::$admin_password"
          cat > .env <<EOF
          APP_PUBLIC_URL=http://localhost:8080
          CORS_ORIGINS=http://localhost:8080
          POSTGRES_USER=referral
          POSTGRES_PASSWORD=${pg_password}
          POSTGRES_DB=referral
          REDIS_PASSWORD=${redis_password}
          OTP_PEPPER=${otp_pepper}
          OTP_OUTBOX_KEY=${otp_outbox_key}
          MFA_ENCRYPTION_KEY=${mfa_encryption_key}
          COOKIE_SECURE=true
          SMTP_HOST=mailpit
          SMTP_PORT=1025
          SMTP_SECURE=false
          MAIL_FROM=Referral Platform <no-reply@example.com>
          SEED_SUPER_ADMIN_EMAIL=admin@example.com
          SEED_SUPER_ADMIN_PASSWORD=${admin_password}
          SEED_DEMO_DATA=true
          LOG_LEVEL=info
          THROTTLE_DEFAULT_LIMIT=100000
          THROTTLE_AUTH_LIMIT=10000
          THROTTLE_OTP_LIMIT=10000
          EOF
          echo "E2E_ADMIN_EMAIL=admin@example.com" >> "$GITHUB_ENV"
          echo "E2E_ADMIN_PASSWORD=${admin_password}" >> "$GITHUB_ENV"
          # The whole suite logs in/registers from one runner IP: exempt it from nginx's limits.
          printf '0.0.0.0/0  1;\n' > infra/nginx/snippets/rate-limit-allowlist.conf

      - name: Start stack
        run: docker compose up -d --no-build

      - name: Wait for nginx, API and Mailpit
        run: |
          for url in "$E2E_BASE_URL/nginx-health" "$E2E_BASE_URL/api/v1/health/ready" "$MAILPIT_URL/readyz"; do
            echo "waiting for $url"
            timeout 240 bash -c "until curl -fsS -o /dev/null '$url'; do sleep 3; done"
          done

      - name: Seed (roles, settings, super admin, demo data)
        run: docker compose run --rm seed

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright
        run: pnpm exec playwright test

      - name: Collect container logs
        if: always()
        run: docker compose logs --no-color --timestamps > compose-logs.txt 2>&1 || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            compose-logs.txt
          retention-days: 14
          if-no-files-found: ignore

      - name: Stop stack
        if: always()
        run: docker compose down -v --remove-orphans
