# Single origin: http://<host>:8080 (container :80).
#   /api/*            → api:4000   (NestJS; JSON errors from nginx for 429/502/503/504)
#   /_next/static/*   → web:3000   (cached here, immutable)
#   everything else   → web:3000   (Next.js; streaming + WebSocket upgrade)

# Docker's embedded DNS. Upstream servers use `resolve`, so names are looked up at run time and
# re-resolved when containers are recreated or scaled (`docker compose up --scale api=3`);
# nginx also starts — and `nginx -t` passes — before the app containers exist.
resolver          127.0.0.11 valid=10s ipv6=off;
resolver_timeout  5s;

upstream api_upstream {
    zone       api_upstream 64k;
    server     api:4000 resolve;
    keepalive  32;
    keepalive_timeout  60s;
}

upstream web_upstream {
    zone       web_upstream 64k;
    server     web:3000 resolve;
    keepalive  32;
    keepalive_timeout  60s;
}

server {
    listen       80 default_server;
    server_name  _;

    include  /etc/nginx/snippets/response-headers.conf;

    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
        return 405;
    }

    # Liveness of nginx itself (container healthcheck / external probes). Not logged.
    location = /nginx-health {
        default_type  text/plain;
        return 200 "ok\n";
    }

    # Never proxy dotfiles (/.env, /.git, ...) except ACME / well-known URIs.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # ── API ──────────────────────────────────────────────────────────────────
    # Authentication endpoints: strict limit on state-changing requests (≈10/min per IP, burst 20)
    # on top of the general API limit.
    location /api/v1/auth/ {
        limit_req  zone=auth_mutations  burst=20  nodelay;
        limit_req  zone=api_general     burst=40  nodelay;
        error_page 429 = @api_rate_limited;
        error_page 502 503 504 = @api_unavailable;

        include  /etc/nginx/snippets/proxy-common.conf;
        include  /etc/nginx/snippets/response-headers.conf;
        proxy_set_header  Connection  "";
        proxy_pass        http://api_upstream;
    }

    location /api/ {
        limit_req  zone=api_general  burst=40  nodelay;
        error_page 429 = @api_rate_limited;
        error_page 502 503 504 = @api_unavailable;

        include  /etc/nginx/snippets/proxy-common.conf;
        include  /etc/nginx/snippets/response-headers.conf;
        proxy_set_header  Connection  "";
        proxy_pass        http://api_upstream;
    }

    # Error bodies follow the API envelope: { "error": { code, message, requestId } }.
    location @api_rate_limited {
        default_type  application/json;
        include       /etc/nginx/snippets/response-headers.conf;
        add_header    Retry-After    10          always;
        add_header    Cache-Control  "no-store"  always;
        return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests. Please wait a moment and try again.","requestId":"$req_id"}}\n';
    }

    location @api_unavailable {
        default_type  application/json;
        include       /etc/nginx/snippets/response-headers.conf;
        add_header    Retry-After    5           always;
        add_header    Cache-Control  "no-store"  always;
        return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"The service is temporarily unavailable. Please try again shortly.","requestId":"$req_id"}}\n';
    }

    # ── Web (Next.js) ────────────────────────────────────────────────────────
    # Content-hashed build assets: cache in nginx and in browsers for a year.
    location /_next/static/ {
        include  /etc/nginx/snippets/proxy-common.conf;
        include  /etc/nginx/snippets/response-headers.conf;
        proxy_set_header  Connection  "";

        proxy_cache            next_static;
        proxy_cache_valid      200 7d;
        proxy_cache_valid      404 10s;
        proxy_cache_lock       on;
        proxy_cache_use_stale  error timeout updating http_502 http_503 http_504;
        # Assets are content-hashed: cache by proxy_cache_valid regardless of upstream headers.
        proxy_ignore_headers   Set-Cookie Cache-Control Expires;
        proxy_hide_header      Set-Cookie;
        proxy_hide_header      Cache-Control;
        # No `always`: error responses (e.g. a 404 during a rolling deploy) must not be cached for a year.
        add_header  Cache-Control   "public, max-age=31536000, immutable";
        add_header  X-Cache-Status  $upstream_cache_status  always;

        proxy_pass  http://web_upstream;
    }

    location / {
        include  /etc/nginx/snippets/proxy-common.conf;
        include  /etc/nginx/snippets/response-headers.conf;
        proxy_set_header  Upgrade     $http_upgrade;
        proxy_set_header  Connection  $connection_upgrade;

        # App Router streams HTML/RSC (Suspense, Partial Prerendering): pass chunks through as they
        # arrive instead of buffering the whole response.
        proxy_buffering  off;

        proxy_pass  http://web_upstream;
    }
}

# ─── TLS template ────────────────────────────────────────────────────────────
# To terminate TLS in this nginx: mount certificates (e.g. /etc/nginx/certs, read-only), publish
# 443 in docker-compose.prod.yml, set APP_PUBLIC_URL=https://example.com and COOKIE_SECURE=true,
# then replace the server block above with the two below. With TLS terminated by a load balancer
# in front instead, keep the block above and configure set_real_ip_from + X-Forwarded-Proto
# (nginx.conf / snippets/proxy-common.conf).
#
# server {
#     listen       80 default_server;
#     server_name  _;
#
#     location ^~ /.well-known/acme-challenge/ {
#         root  /var/www/acme;            # HTTP-01 challenges (certbot / lego webroot)
#     }
#     location / {
#         return 301 https://$host$request_uri;
#     }
# }
#
# server {
#     listen       443 ssl default_server;
#     listen       443 quic reuseport;     # optional HTTP/3 (also publish 443/udp)
#     http2        on;
#     server_name  example.com;            # reject other Host headers (default_server above answers them)
#
#     ssl_certificate      /etc/nginx/certs/fullchain.pem;
#     ssl_certificate_key  /etc/nginx/certs/privkey.pem;
#     ssl_protocols        TLSv1.2 TLSv1.3;
#     ssl_prefer_server_ciphers  off;
#     ssl_session_cache    shared:TLS:10m;
#     ssl_session_timeout  1d;
#     ssl_session_tickets  off;
#     ssl_stapling         on;
#     ssl_stapling_verify  on;
#
#     include  /etc/nginx/snippets/response-headers.conf;
#     # HSTS: start with a short max-age, raise to 2 years once HTTPS is confirmed everywhere, and
#     # add `preload` only after reading https://hstspreload.org. Must be repeated in every location
#     # below that has its own add_header (or moved into snippets/response-headers.conf for a
#     # TLS-only deployment).
#     add_header  Strict-Transport-Security  "max-age=63072000; includeSubDomains"  always;
#     add_header  Alt-Svc  'h3=":443"; ma=86400'  always;
#
#     # …then copy every `location` block from the plain-HTTP server above, unchanged. In the CSP
#     # default (nginx.conf, $hdr_csp) append `; upgrade-insecure-requests`.
# }
