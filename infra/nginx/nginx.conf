# Reverse proxy for the Referral & Rewards Platform: one origin, /api/* → API, everything else → web.
# Mounted read-only at /etc/nginx by docker-compose.prod.yml. Validate with:
#   docker run --rm -v "$PWD/infra/nginx:/etc/nginx:ro" nginx:alpine nginx -t
# The upstream names (api, web) are resolved at run time through Docker's DNS (see conf.d/default.conf),
# so `nginx -t` does not need the containers to exist.

user  nginx;
worker_processes  auto;
worker_rlimit_nofile  65535;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;

    server_tokens  off;

    # ── Client IP ──────────────────────────────────────────────────────────────
    # nginx is the edge in docker-compose.prod.yml, so $remote_addr is the client. When another load
    # balancer / CDN terminates connections in front of nginx, trust ONLY its address range here so
    # that $remote_addr (used for rate limiting, logs and X-Forwarded-For) becomes the real client:
    # set_real_ip_from  10.0.0.0/8;          # your LB subnet(s) — never 0.0.0.0/0
    # real_ip_header    X-Forwarded-For;
    # real_ip_recursive on;

    # ── Request id ────────────────────────────────────────────────────────────
    # Pass through a well-formed client/LB supplied X-Request-Id, otherwise generate one. The value
    # is forwarded upstream, echoed in the response and written to the access log, so the API's
    # `requestId` in error bodies and logs correlates with nginx. The accepted shape matches the
    # API's own check (apps/api/src/common/context/request-context.ts: 8–64 chars); a longer value
    # would be replaced by the API and break the correlation.
    map $http_x_request_id $req_id {
        "~^[A-Za-z0-9._:-]{8,64}$"   $http_x_request_id;
        default                      $request_id;
    }

    # Host as the browser sent it (keeps the :8080 port). Next.js compares Origin with the forwarded
    # host for Server Actions, so stripping the port would break them behind a mapped port.
    map $http_host $fwd_host {
        ""       $host;
        default  $http_host;
    }

    # ── Access log (JSON, one object per line) ──────────────────────────────────
    # $uri (path without query string) is logged instead of $request_uri: query strings may carry
    # search terms (emails) or codes. Cookies and Authorization headers are never logged.
    log_format json_access escape=json
        '{'
            '"time":"$time_iso8601",'
            '"request_id":"$req_id",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"host":"$host",'
            '"path":"$uri",'
            '"protocol":"$server_protocol",'
            '"status":$status,'
            '"bytes_sent":$body_bytes_sent,'
            '"request_length":$request_length,'
            '"request_time":$request_time,'
            '"upstream_addr":"$upstream_addr",'
            '"upstream_status":"$upstream_status",'
            '"upstream_response_time":"$upstream_response_time",'
            '"cache":"$upstream_cache_status",'
            '"user_agent":"$http_user_agent"'
        '}';

    map $uri $loggable {
        /nginx-health  0;
        default        1;
    }
    access_log  /var/log/nginx/access.log  json_access  if=$loggable;

    # ── Connections, timeouts, limits ─────────────────────────────────────────
    sendfile                   on;
    tcp_nopush                 on;
    tcp_nodelay                on;
    keepalive_timeout          65s;
    keepalive_requests         1000;
    client_header_timeout      15s;
    client_body_timeout        30s;
    send_timeout               30s;
    reset_timedout_connection  on;

    client_max_body_size         2m;
    client_body_buffer_size      128k;
    large_client_header_buffers  4 16k;

    # Next.js sends large response headers (Link preloads, RSC metadata); the defaults (4k/8k)
    # would turn those into "upstream sent too big header" 502s.
    proxy_buffer_size        32k;
    proxy_buffers            16 32k;
    proxy_busy_buffers_size  64k;

    # ── Compression ───────────────────────────────────────────────────────────
    # Responses that already carry Content-Encoding (Next.js compresses by default) are passed as-is.
    gzip               on;
    gzip_vary          on;
    gzip_proxied       any;
    gzip_comp_level    5;
    gzip_min_length    1024;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/problem+json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # ── WebSocket / HTTP upgrade (Next.js) ───────────────────────────────────
    # Empty Connection header (not "close") for normal requests keeps upstream keep-alive working.
    map $http_upgrade $connection_upgrade {
        default  upgrade;
        ""       "";
    }

    # ── Rate limiting ────────────────────────────────────────────────────────
    # Coarse, per-IP flood protection in front of the API. The API enforces the fine-grained limits
    # from docs/business-rules.md §2 (per IP and per account/email) itself.
    #
    # Networks listed in snippets/rate-limit-allowlist.conf bypass these limits (empty by default;
    # CI writes the runner network there for e2e runs).
    geo $rate_limit_exempt {
        default  0;
        include  /etc/nginx/snippets/rate-limit-allowlist.conf;
    }
    # An empty key means "not counted".
    map $rate_limit_exempt $rl_api_key {
        1        "";
        default  $binary_remote_addr;
    }
    # Auth: only state-changing requests (login, register, OTP send/verify, password reset) count;
    # session/CSRF reads (GET) are frequent and harmless.
    map "$rate_limit_exempt:$request_method" $rl_auth_key {
        "~^1:"                    "";
        "~^0:(GET|HEAD|OPTIONS)$" "";
        default                   $binary_remote_addr;
    }
    limit_req_zone  $rl_auth_key  zone=auth_mutations:10m  rate=10r/m;
    limit_req_zone  $rl_api_key   zone=api_general:10m     rate=20r/s;
    limit_req_status     429;
    limit_req_log_level  warn;

    # ── Security headers ─────────────────────────────────────────────────────
    # Defaults are applied only when the upstream did not set the header itself (helmet in the API,
    # `headers()` in next.config.ts), so nothing is duplicated or contradicted; nginx-generated
    # responses (429, 502, health) always get them. An empty value means add_header emits nothing.
    map $upstream_http_x_content_type_options $hdr_x_content_type_options {
        ""       "nosniff";
        default  "";
    }
    map $upstream_http_referrer_policy $hdr_referrer_policy {
        ""       "strict-origin-when-cross-origin";
        default  "";
    }
    map $upstream_http_x_frame_options $hdr_x_frame_options {
        ""       "DENY";
        default  "";
    }
    map $upstream_http_permissions_policy $hdr_permissions_policy {
        ""       "camera=(), microphone=(), geolocation=(), payment=(), usb=()";
        default  "";
    }
    map $upstream_http_cross_origin_opener_policy $hdr_coop {
        ""       "same-origin";
        default  "";
    }
    # Baseline CSP. Next.js App Router emits inline bootstrap scripts (self.__next_f.push) and inline
    # styles, so a CSP without nonces must allow 'unsafe-inline' for script/style. A strict nonce
    # CSP has to be produced per request by Next.js itself (proxy.ts) and forces dynamic rendering,
    # which conflicts with the static shells of Cache Components — see docs/security.md. If the web
    # app ever sends its own Content-Security-Policy, this default steps aside automatically.
    # `upgrade-insecure-requests` is added in the TLS server only (it would break plain-HTTP :8080).
    # img-src allows any https: origin because member avatars are external URLs (avatarUrl is
    # validated as https:// by the API); images cannot execute script, so this does not widen XSS.
    map $upstream_http_content_security_policy $hdr_csp {
        ""       "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; manifest-src 'self'; worker-src 'self' blob:";
        default  "";
    }

    # ── Static asset cache ───────────────────────────────────────────────────
    # /_next/static/* files are content-hashed and immutable; caching them here offloads Node.
    proxy_cache_path  /var/cache/nginx/next_static  levels=1:2  keys_zone=next_static:10m
                      max_size=512m  inactive=7d  use_temp_path=off;

    include /etc/nginx/conf.d/*.conf;
}
