# Entries for the `geo $rate_limit_exempt` block in nginx.conf: clients in these networks bypass
# nginx's limit_req zones (the API's own per-IP / per-account limits still apply).
#
# Empty by default — keep it that way in production. CI's e2e job overwrites this file so that the
# Playwright run (many logins/registrations from one runner IP) is not throttled, e.g.:
#   0.0.0.0/0  1;
#
# Format: <CIDR> 1;
