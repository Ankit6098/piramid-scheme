# Shared proxy settings, included by every proxied location.
# (proxy_set_header is not inherited once a location defines its own, so locations include this
# file and add their location-specific headers next to it.)

proxy_http_version  1.1;

proxy_set_header  Host               $fwd_host;
proxy_set_header  X-Real-IP          $remote_addr;
# nginx is the edge: overwrite (do not append to) any client-supplied X-Forwarded-For, so the API
# (TRUST_PROXY=true → Express uses the left-most entry) can never be fed a spoofed client IP.
# Behind another LB, configure set_real_ip_from in nginx.conf; $remote_addr is then the real client.
proxy_set_header  X-Forwarded-For    $remote_addr;
# Behind a TLS-terminating LB, replace $scheme with that LB's X-Forwarded-Proto (via a map).
proxy_set_header  X-Forwarded-Proto  $scheme;
proxy_set_header  X-Forwarded-Host   $fwd_host;
proxy_set_header  X-Request-Id       $req_id;
# httpoxy mitigation.
proxy_set_header  Proxy              "";

# nginx emits its own X-Request-Id (same value the upstream received) — avoid duplicates.
proxy_hide_header  X-Request-Id;
proxy_hide_header  X-Powered-By;

proxy_connect_timeout  5s;
proxy_send_timeout     60s;
proxy_read_timeout     60s;

# Retry another instance only when the request never reached the app (connection errors). nginx
# never retries non-idempotent requests (POST, PATCH, ...) unless explicitly told to.
proxy_next_upstream          error timeout;
proxy_next_upstream_tries    2;
proxy_next_upstream_timeout  10s;
