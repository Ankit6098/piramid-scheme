# Response headers added by nginx. Included at server level and again in every location that sets
# its own add_header (add_header directives are not inherited once a location defines any).
# The $hdr_* defaults are empty — i.e. not emitted — when the upstream already sent that header
# (see the maps in nginx.conf).

add_header  X-Request-Id                  $req_id                       always;
add_header  X-Content-Type-Options        $hdr_x_content_type_options   always;
add_header  Referrer-Policy               $hdr_referrer_policy          always;
add_header  X-Frame-Options               $hdr_x_frame_options          always;
add_header  Permissions-Policy            $hdr_permissions_policy       always;
add_header  Cross-Origin-Opener-Policy    $hdr_coop                     always;
add_header  Content-Security-Policy       $hdr_csp                      always;

# HSTS is only meaningful (and only safe) over HTTPS. It is enabled in the TLS server template in
# conf.d/default.conf — do not send it from the plain-HTTP server:
# add_header  Strict-Transport-Security  "max-age=63072000; includeSubDomains"  always;
